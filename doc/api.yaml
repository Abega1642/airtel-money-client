openapi: 3.0.3
info:
  title: Airtel Money API — Madagascar
  description: |
    OpenAPI specification for the Airtel Money API (Madagascar).
    Covers the three endpoints required for merchant payment collection:
      - OAuth2 token acquisition
      - USSD Push payment initiation (Collection API)
      - Transaction status enquiry (Standard API)

    Base URLs:
      - Staging:    https://openapiuat.airtel.mg
      - Production: https://openapi.airtel.mg

    All request and response payloads use snake_case field names.

    Country code : MG
    Currency code: MGA
  version: "2.0"
  contact:
    name: Airtel Africa Developer Support
servers:
  - url: https://openapiuat.airtel.mg
    description: Staging environment
  - url: https://openapi.airtel.mg
    description: Production environment
tags:
  - name: Authentication
    description: OAuth2 token management.
  - name: Collection
    description: USSD Push payment initiation — request money from a customer's Airtel Money wallet.
  - name: Transaction
    description: Transaction status enquiry — verify the outcome of a previously initiated payment.
paths:
  /auth/oauth2/token:
    post:
      tags:
        - Authentication
      summary: Acquire an OAuth2 bearer token
      description: |
        Issues a bearer access token using the Client Credentials grant type.
        The returned `access_token` must be included as a Bearer token in the
        `Authorization` header of all subsequent API calls.

        Tokens typically expire after 3600 seconds (60 minutes). The exact
        expiry is returned in the `expires_in` field of the response. Callers
        should cache the token and refresh it before expiry to avoid unnecessary
        round trips.

        This endpoint is common to all Airtel Africa API products.
      operationId: getAccessToken
      parameters:
        - $ref: '#/components/parameters/ContentTypeJson'
        - $ref: '#/components/parameters/AcceptAny'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              client_id: "c02e9e46-db9d-4faf-b91a-94f88bbe688c"
              client_secret: "ab672211-4197-4c11-ba79-b29ce2034ca2"
              grant_type: "client_credentials"
      responses:
        '200':
          description: Token successfully issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: "eyJhbGciOiJSUzI1NiJ9..."
                expires_in: "3600"
                token_type: "bearer"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /merchant/v1/payments/:
    post:
      tags:
        - Collection
      summary: Initiate a USSD Push payment
      description: |
        Sends a USSD Push notification to the customer's mobile device requesting
        payment authorization. The customer receives a popup on their phone and
        must enter their Airtel Money PIN to authorize the transaction.

        Important:
          - A `200 OK` response confirms only that Airtel has accepted the
            instruction to ask the customer. It does NOT mean the customer has
            paid yet.
          - The `transaction.id` in the request must be a unique identifier
            generated by your system. This same ID is used to poll the
            transaction status via GET /standard/v1/payments/{id}.
          - Do NOT include the country code in the `subscriber.msisdn` field.
            Send the local number only (e.g. `330000003`, not `261330000003`).
          - Use the `reference` field to ensure idempotency. If a network error
            occurs and you retry the request, the customer will not be charged
            twice for the same reference.

        After initiating a payment, the final status should be confirmed either
        via callback (if configured) or by polling
        GET /standard/v1/payments/{id} — recommended at least 3 minutes after
        initiation.
      operationId: initiatePayment
      parameters:
        - $ref: '#/components/parameters/AcceptAny'
        - $ref: '#/components/parameters/ContentTypeJson'
        - $ref: '#/components/parameters/XCountry'
        - $ref: '#/components/parameters/XCurrency'
        - $ref: '#/components/parameters/Authorization'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            example:
              reference: "Testing transaction"
              subscriber:
                country: "MG"
                currency: "MGA"
                msisdn: "330000003"
              transaction:
                amount: 1000
                country: "MG"
                currency: "MGA"
                id: "random-unique-id"
      responses:
        '200':
          description: |
            Airtel has accepted the payment instruction and will push a
            notification to the customer. This does not indicate that the
            customer has authorized the payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInitiationResponse'
              example:
                data:
                  transaction:
                    id: "random-unique-id"
                    status: "SUCCESS"
                status:
                  code: "200"
                  message: "SUCCESS"
                  result_code: "ESB000010"
                  response_code: "DP00800001006"
                  success: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '408':
          $ref: '#/components/responses/ReadTimeout'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /standard/v1/payments/{id}:
    get:
      tags:
        - Transaction
      summary: Query transaction status
      description: |
        Retrieves the current status of a previously initiated payment using
        the partner transaction ID (`transaction.id`) that was sent in the
        initiation request.

        It is recommended to wait at least 3 minutes after calling
        POST /merchant/v1/payments/ before performing a status enquiry, to
        allow sufficient time for the customer to respond to the USSD push.

        Possible transaction statuses returned in `data.transaction.status`:
          - `TS`  — Transaction Success
          - `TF`  — Transaction Failed
          - `TIP` — Transaction In Progress
          - `TA`  — Transaction Ambiguous (still processing — retry later)
          - `TE`  — Transaction Expired

        Note: `status.success` in the envelope may be `false` even on HTTP 200.
        Always use `data.transaction.status` to determine the actual outcome.
      operationId: getTransactionStatus
      parameters:
        - name: id
          in: path
          required: true
          description: |
            The partner transaction ID (`transaction.id`) that was sent in the
            payment initiation request. This is your system-generated unique
            identifier, not an Airtel-generated ID.
          schema:
            $ref: '#/components/schemas/TransactionId'
        - $ref: '#/components/parameters/AcceptAny'
        - $ref: '#/components/parameters/XCountry'
        - $ref: '#/components/parameters/XCurrency'
        - $ref: '#/components/parameters/Authorization'
      responses:
        '200':
          description: |
            Transaction enquiry completed. Inspect `data.transaction.status`
            for the actual transaction outcome — HTTP 200 alone does not
            indicate a successful payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionEnquiryResponse'
              example:
                data:
                  transaction:
                    airtel_money_id: "C36xxxxxxx67"
                    id: "random-unique-id"
                    message: "success"
                    status: "TS"
                status:
                  code: "200"
                  message: "SUCCESS"
                  result_code: "ESB000010"
                  response_code: "DP00800001006"
                  success: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '408':
          $ref: '#/components/responses/ReadTimeout'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
  parameters:
    ContentTypeJson:
      name: Content-Type
      in: header
      required: true
      description: Media type of the request body. Must be `application/json`.
      schema:
        type: string
        enum:
          - application/json
      example: application/json
    AcceptAny:
      name: Accept
      in: header
      required: true
      description: Media type the client accepts in the response.
      schema:
        type: string
        default: "*/*"
      example: "*/*"
    XCountry:
      name: X-Country
      in: header
      required: true
      description: |
        ISO 3166-1 alpha-2 country code for the transaction.
        For Madagascar: `MG`.
      schema:
        $ref: '#/components/schemas/CountryCode'
    XCurrency:
      name: X-Currency
      in: header
      required: true
      description: |
        ISO 4217 currency code for the transaction.
        For Madagascar: `MGA`.
      schema:
        $ref: '#/components/schemas/CurrencyCode'
    Authorization:
      name: Authorization
      in: header
      required: true
      description: |
        Bearer token obtained from POST /auth/oauth2/token.
        Format: `Bearer <access_token>`.
      schema:
        type: string
        pattern: '^Bearer [A-Za-z0-9\-._~+/]+=*$'
      example: "Bearer eyJhbGciOiJSUzI1NiJ9..."
  schemas:
    Msisdn:
      type: string
      description: |
        Mobile subscriber number WITHOUT the country code prefix.
        For Madagascar, strip the leading `261`.
        Example: `330000003` (not `261330000003`).
      pattern: '^\d{6,15}$'
      example: "330000003"
    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2 country code.
      minLength: 2
      maxLength: 2
      pattern: '^[A-Z]{2}$'
      example: "MG"
    CurrencyCode:
      type: string
      description: ISO 4217 currency code.
      minLength: 3
      maxLength: 3
      pattern: '^[A-Z]{3}$'
      example: "MGA"
    TransactionId:
      type: string
      description: |
        Partner-generated unique transaction identifier.
        This is YOUR system's ID — it is used to correlate the payment
        initiation request with subsequent status enquiries and callbacks.
      example: "random-unique-id"
    AirtelMoneyId:
      type: string
      description: |
        Transaction identifier generated by the Airtel Money system upon
        successful processing. Only present when the transaction has reached
        a terminal success state (TS).
      example: "C36xxxxxxx67"
    TransactionStatus:
      type: string
      description: |
        Airtel Money transaction status codes:
          - `TS`  — Transaction Success
          - `TF`  — Transaction Failed
          - `TIP` — Transaction In Progress (customer has not yet responded)
          - `TA`  — Transaction Ambiguous (still processing — perform enquiry)
          - `TE`  — Transaction Expired
      enum:
        - TS
        - TF
        - TIP
        - TA
        - TE
      example: "TS"
    ResponseCode:
      type: string
      description: |
        Product-specific code identifying the response type.
        See the Airtel Money Collection API error codes documentation for
        the full list of possible values.
      example: "DP00800001006"
    ResultCode:
      type: string
      description: |
        Application-specific code identifying the response type.
        Deprecated in favour of `response_code` — provided for backwards
        compatibility only.
      example: "ESB000010"
    StatusEnvelope:
      type: object
      description: |
        Standard Airtel Money response status envelope included in all
        API responses. Present regardless of whether the business operation
        succeeded or failed.

        Important: `success: true` means the API call was processed without
        a system error. It does NOT necessarily mean the payment succeeded.
        Always inspect `data.transaction.status` for the actual outcome.
      required:
        - code
        - message
        - success
      properties:
        code:
          type: string
          description: HTTP status code returned as a string.
          example: "200"
        message:
          type: string
          description: Human-readable description of the response.
          example: "SUCCESS"
        response_code:
          $ref: '#/components/schemas/ResponseCode'
        result_code:
          $ref: '#/components/schemas/ResultCode'
        success:
          type: boolean
          description: |
            `true` if the API processed the request without a system error.
            Note: this field may be `false` even on HTTP 200 in some edge cases.
            Always validate `data.transaction.status` for definitive payment outcome.
          example: true
    TokenRequest:
      type: object
      description: Request body for acquiring an OAuth2 bearer token.
      required:
        - client_id
        - client_secret
        - grant_type
      properties:
        client_id:
          type: string
          description: |
            Public identifier for the application. Equivalent to the Consumer Key
            displayed in the Airtel developer portal under application settings.
          example: "c02e9e46-db9d-4faf-b91a-94f88bbe688c"
        client_secret:
          type: string
          description: |
            Secret known only to the application and the Airtel authorization server.
            Equivalent to the Consumer Secret in the developer portal.
            Never share this value.
          example: "ab672211-4197-4c11-ba79-b29ce2034ca2"
        grant_type:
          type: string
          description: |
            OAuth2 grant type. Must always be `client_credentials` for
            server-to-server integration.
          enum:
            - client_credentials
          example: "client_credentials"
    TokenResponse:
      type: object
      description: Response body containing the issued bearer token.
      required:
        - access_token
        - expires_in
        - token_type
      properties:
        access_token:
          type: string
          description: |
            The bearer token to include in the `Authorization` header of all
            subsequent API requests. Format: `Bearer <access_token>`.
          example: "eyJhbGciOiJSUzI1NiJ9..."
        expires_in:
          type: string
          description: |
            Token validity duration in seconds, returned as a string.
            Tokens typically expire after 3600 seconds (60 minutes).
            Cache and reuse the token until it is close to expiry.
          example: "3600"
        token_type:
          type: string
          description: Token type. Always `bearer`.
          enum:
            - bearer
          example: "bearer"
    PaymentSubscriber:
      type: object
      description: Details of the Airtel Money subscriber (payer) from whom funds will be collected.
      required:
        - msisdn
      properties:
        country:
          $ref: '#/components/schemas/CountryCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        msisdn:
          $ref: '#/components/schemas/Msisdn'
    PaymentTransaction:
      type: object
      description: Transaction details for the payment initiation request.
      required:
        - amount
        - id
      properties:
        amount:
          type: number
          description: |
            Amount to deduct from the subscriber's Airtel Money wallet.
            Must be a positive number. Decimals are accepted.
          minimum: 0.01
          example: 1000
        country:
          $ref: '#/components/schemas/CountryCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        id:
          $ref: '#/components/schemas/TransactionId'
    PaymentRequest:
      type: object
      description: Request body for initiating a USSD Push payment collection.
      required:
        - reference
        - subscriber
        - transaction
      properties:
        reference:
          type: string
          description: |
            A reference string describing the service or goods being purchased.
            Used for idempotency — reusing the same reference for a retry
            prevents the customer from being charged twice.
          maxLength: 25
          example: "Testing transaction"
        subscriber:
          $ref: '#/components/schemas/PaymentSubscriber'
        transaction:
          $ref: '#/components/schemas/PaymentTransaction'
    PaymentInitiationTransactionData:
      type: object
      description: Transaction data returned in the payment initiation response.
      properties:
        id:
          $ref: '#/components/schemas/TransactionId'
        status:
          type: string
          description: |
            Immediate status of the initiation request — indicates whether
            Airtel accepted the instruction, not whether the customer paid.
          example: "SUCCESS"
    PaymentInitiationData:
      type: object
      description: Data envelope in the payment initiation response.
      properties:
        transaction:
          $ref: '#/components/schemas/PaymentInitiationTransactionData'
    PaymentInitiationResponse:
      type: object
      description: Response body for POST /merchant/v1/payments/.
      required:
        - data
        - status
      properties:
        data:
          $ref: '#/components/schemas/PaymentInitiationData'
        status:
          $ref: '#/components/schemas/StatusEnvelope'
    TransactionEnquiryTransactionData:
      type: object
      description: Detailed transaction data returned by the status enquiry endpoint.
      properties:
        airtel_money_id:
          $ref: '#/components/schemas/AirtelMoneyId'
        id:
          $ref: '#/components/schemas/TransactionId'
        message:
          type: string
          description: Human-readable description of the transaction status.
          example: "success"
        status:
          $ref: '#/components/schemas/TransactionStatus'
    TransactionEnquiryData:
      type: object
      description: Data envelope in the transaction enquiry response.
      properties:
        transaction:
          $ref: '#/components/schemas/TransactionEnquiryTransactionData'
    TransactionEnquiryResponse:
      type: object
      description: Response body for GET /standard/v1/payments/{id}.
      required:
        - data
        - status
      properties:
        data:
          $ref: '#/components/schemas/TransactionEnquiryData'
        status:
          $ref: '#/components/schemas/StatusEnvelope'
    ErrorResponse:
      type: object
      description: |
        Error response envelope returned by Airtel Money on non-2xx HTTP responses.

        WARNING: The exact structure of this object has not been verified against
        the live Airtel Money sandbox for Madagascar. The Airtel Money documentation
        provided does not include a concrete error response body example.
        This schema uses a free-form object as a placeholder.

        Once a real error response is observed in the sandbox, this schema must
        be updated with the confirmed structure before going to production.
      additionalProperties: true
  responses:
    BadRequest:
      description: |
        Bad Request — the request is invalid, missing a required parameter,
        or contains a malformed value.
        Common causes: missing mandatory header or body field (ROUTER003),
        invalid country code (ROUTER006), invalid currency (ROUTER112 / ROUTER119).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: |
        Unauthorized — the bearer token is missing, expired, or invalid.
        Obtain a new token via POST /auth/oauth2/token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: |
        Forbidden — the application is not authorized to perform this operation
        in the specified country, or the resource is restricted.
        Common causes: ROUTER007 (user not authorized for country).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: |
        Not Found — the specified transaction ID does not exist.
        Common cause: DP00800001025 (Transaction Not Found).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReadTimeout:
      description: |
        Read Timeout — the request timed out.
        For payment or refund operations, perform a transaction enquiry
        (GET /standard/v1/payments/{id}) before retrying.
        Common cause: ROUTER117.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Too Many Requests — rate limit exceeded. Implement exponential backoff before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal Server Error — an unexpected error occurred on the Airtel server. Retry after a short delay.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: |
        Bad Gateway — upstream communication error.
        For payment or refund operations, perform a transaction enquiry before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Service Unavailable — Airtel Money is temporarily offline for maintenance. Retry after a short delay.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: |
        Gateway Timeout — the upstream service did not respond in time.
        For payment or refund operations, perform a transaction enquiry before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
